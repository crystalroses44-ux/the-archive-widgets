<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 10px;
      background: transparent;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      color: #51483D;
    }


    /* ─────────────────────────────
       MAIN FRAME
    ───────────────────────────── */

    .ao3-widget {
      width: 100%;

      padding:
        18px 20px 15px;

      background:
        linear-gradient(
          180deg,
          #FFFFFF 0%,
          #FDFCF8 100%
        );

      border:
        1px solid #B68B45;

      outline:
        1px solid #DED5BD;

      outline-offset: -5px;
    }


    /* ─────────────────────────────
       HEADER
    ───────────────────────────── */

    .widget-heading {
      text-align: center;
      margin-bottom: 18px;
    }

    .widget-heading .ornament {
      color: #B68B45;
      font-size: 10px;
      margin-bottom: 4px;
    }

    .widget-heading h1 {
      margin: 0;

      font-size: 16px;
      font-weight: normal;

      letter-spacing: 0.14em;
      text-transform: uppercase;

      color: #51483D;
    }

    .widget-heading p {
      margin: 4px 0 0;

      font-size: 11px;
      font-style: italic;

      color: #829074;
    }


    /* ─────────────────────────────
       FIC GRID
    ───────────────────────────── */

    #ficShelf {
      width: 100%;

      display: grid;

      grid-template-columns:
        repeat(5, minmax(0, 1fr));

      gap: 18px;

      align-items: stretch;
    }


    /* ─────────────────────────────
       INDIVIDUAL MANUSCRIPT CARD
    ───────────────────────────── */

    .fic-card {
      position: relative;

      min-width: 0;

      padding:
        18px 14px 15px;

      background:
        linear-gradient(
          180deg,
          #FBFAF5 0%,
          #F7F4EA 100%
        );

      border:
        1px solid #D8CFB7;

      text-align: center;

      display: flex;
      flex-direction: column;

      min-height: 235px;
    }


    .fic-card::before {
      content: "✦";

      position: absolute;

      top: 8px;
      left: 50%;

      transform:
        translateX(-50%);

      color: #B68B45;

      font-size: 7px;
    }


    .fic-title {
      margin:
        8px 0 5px;

      font-size: 13px;
      line-height: 1.3;

      font-weight: normal;
    }

    .fic-title a {
      color: #51483D;
      text-decoration: none;
    }

    .fic-title a:hover {
      text-decoration: underline;
    }


    .fic-author {
      margin-bottom: 12px;

      font-size: 10.5px;

      font-style: italic;

      color: #829074;
    }


    /* tiny ornamental rule */

    .mini-rule {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 5px;

      margin:
        0 auto 11px;
    }

    .mini-rule span {
      display: block;

      width: 18px;
      height: 1px;

      background: #D1C49E;
    }

    .mini-rule b {
      color: #B68B45;

      font-size: 6px;

      font-weight: normal;
    }


    /* metadata */

    .fic-meta {
      flex: 1;

      font-size: 9.5px;
      line-height: 1.45;

      color: #6D655B;
    }

    .meta-label {
      color: #829074;

      font-size: 8px;

      letter-spacing: 0.08em;

      text-transform: uppercase;
    }

    .meta-line {
      margin-bottom: 7px;
    }


    .relationship {
      font-style: italic;
    }


    /* status */

    .status {
      display: inline-block;

      margin-top: 2px;

      padding:
        2px 7px;

      border:
        1px solid #C7B98F;

      font-size: 8.5px;

      color: #70433F;

      background: #FCFAF3;
    }


    /* open fic */

    .read-link {
      display: inline-block;

      margin-top: 11px;

      font-size: 9.5px;
      font-style: italic;

      color: #70433F;

      text-decoration: none;
    }

    .read-link:hover {
      text-decoration: underline;
    }


    /* ─────────────────────────────
       FOOTER
    ───────────────────────────── */

    .widget-footer {
      text-align: center;
      margin-top: 13px;
    }

    .footer-ornament {
      display: flex;

      justify-content: center;
      align-items: center;

      gap: 7px;

      margin-bottom: 8px;
    }

    .footer-ornament span {
      display: block;

      width: 34px;
      height: 1px;

      background: #C8B788;
    }

    .footer-ornament b {
      color: #B68B45;

      font-size: 8px;
      font-weight: normal;
    }


    /* pagination */

    .pagination {
      min-height: 22px;

      display: flex;

      justify-content: center;
      align-items: center;

      gap: 13px;
    }

    .page-button {
      padding: 3px 5px;

      border: none;

      background: transparent;

      color: #70433F;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 11px;
      font-style: italic;

      cursor: pointer;
    }

    .page-button:hover:not(:disabled) {
      text-decoration: underline;
    }

    .page-button:disabled {
      opacity: 0.28;
      cursor: default;
    }

    #pageIndicator {
      min-width: 46px;

      font-size: 9.5px;

      letter-spacing: 0.05em;

      color: #829074;
    }


    /* empty state */

    .empty-message {
      grid-column: 1 / -1;

      padding: 30px;

      text-align: center;

      font-size: 11px;

      font-style: italic;

      color: #829074;
    }


    /* responsive */

    @media (max-width: 850px) {
      #ficShelf {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      #ficShelf {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }

  </style>
</head>


<body>

  <section class="ao3-widget">

    <header class="widget-heading">

      <div class="ornament">
        ✦
      </div>

      <h1>
        From the Archive
      </h1>

      <p>
        bookmarked works from AO3
      </p>

    </header>


    <div id="ficShelf"></div>


    <div class="widget-footer">

      <div class="footer-ornament">

        <span></span>

        <b>✦</b>

        <span></span>

      </div>


      <div
        class="pagination"
        id="pagination"
        style="display:none;"
      >

        <button
          class="page-button"
          id="previousButton"
        >
          ‹ Previous
        </button>


        <span id="pageIndicator">
          1 of 1
        </span>


        <button
          class="page-button"
          id="nextButton"
        >
          Next ›
        </button>

      </div>

    </div>

  </section>


  <script>

    /* ═══════════════════════════════════════
       YOUR AO3 BOOKMARKS

       THIS IS THE ONLY SECTION
       YOU NEED TO EDIT LATER.

       Copy one {...} block for every fic.

       You can have 5, 10, 20, etc.
       Pagination happens automatically.
    ═══════════════════════════════════════ */

    const bookmarks = [

      /*
      {
        title:
          "Fic Title",

        author:
          "Author Name",

        fandom:
          "Jujutsu Kaisen",

        relationship:
          "Gojo Satoru/Geto Suguru",

        words:
          "82,431",

        status:
          "Complete",

        url:
          "https://archiveofourown.org/works/12345678"
      },
      */

    ];


    /* ═══════════════════════════════════════
       YOU DON'T NEED TO EDIT BELOW HERE
    ═══════════════════════════════════════ */


    const worksPerPage = 5;

    let currentPage = 1;


    function createCard(work) {

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "fic-card";


      card.innerHTML = `

        <h2 class="fic-title">

          <a
            href="${work.url}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${work.title}
          </a>

        </h2>


        <div class="fic-author">
          ${work.author}
        </div>


        <div class="mini-rule">

          <span></span>

          <b>✦</b>

          <span></span>

        </div>


        <div class="fic-meta">

          <div class="meta-line">

            <div class="meta-label">
              Fandom
            </div>

            ${work.fandom}

          </div>


          <div class="meta-line relationship">

            <div class="meta-label">
              Relationship
            </div>

            ${work.relationship}

          </div>


          <div class="meta-line">

            <div class="meta-label">
              Words
            </div>

            ${work.words}

          </div>


          <span class="status">
            ${work.status}
          </span>

        </div>


        <a
          class="read-link"
          href="${work.url}"
          target="_blank"
          rel="noopener noreferrer"
        >
          Read on AO3 →
        </a>

      `;


      return card;
    }


    function renderPage() {

      const shelf =
        document.getElementById(
          "ficShelf"
        );


      shelf.innerHTML = "";


      if (!bookmarks.length) {

        shelf.innerHTML =
          `
          <div class="empty-message">
            No works have been shelved here yet.
          </div>
          `;

        return;
      }


      const totalPages =
        Math.ceil(
          bookmarks.length
          / worksPerPage
        );


      const start =
        (currentPage - 1)
        * worksPerPage;


      const works =
        bookmarks.slice(
          start,
          start + worksPerPage
        );


      works.forEach(work => {

        shelf.appendChild(
          createCard(work)
        );

      });


      document
        .getElementById(
          "pageIndicator"
        )
        .textContent =
          `${currentPage} of ${totalPages}`;


      document
        .getElementById(
          "previousButton"
        )
        .disabled =
          currentPage === 1;


      document
        .getElementById(
          "nextButton"
        )
        .disabled =
          currentPage === totalPages;


      document
        .getElementById(
          "pagination"
        )
        .style.display =
          totalPages > 1
            ? "flex"
            : "none";

    }


    document
      .getElementById(
        "previousButton"
      )
      .addEventListener(
        "click",
        () => {

          if (currentPage > 1) {

            currentPage--;

            renderPage();

          }

        }
      );


    document
      .getElementById(
        "nextButton"
      )
      .addEventListener(
        "click",
        () => {

          const totalPages =
            Math.ceil(
              bookmarks.length
              / worksPerPage
            );


          if (
            currentPage
            < totalPages
          ) {

            currentPage++;

            renderPage();

          }

        }
      );


    renderPage();

  </script>

</body>

</html>
