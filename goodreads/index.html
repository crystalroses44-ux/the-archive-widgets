<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: Georgia, serif;
    }

    .gr_custom_container_ {
      border: none !important;
      border-radius: 0 !important;
      padding: 0 !important;
      background: transparent !important;
      width: 100% !important;
      color: #51483D !important;
    }

    .gr_custom_header_ {
      display: none !important;
    }

    .gr_custom_each_container_ {
      width: 100%;
      clear: both;
      margin-bottom: 12px;
      overflow: auto;
      padding-bottom: 10px;
      border-bottom: 1px solid #d8d0c3;
    }

    .gr_custom_book_container_ {
      overflow: hidden;
      height: 90px;
      float: left;
      margin-right: 10px;
      width: 60px;
    }

    .gr_custom_book_container_ img {
      width: 60px;
      height: 90px;
      object-fit: cover;
    }

    .gr_custom_author_ {
      font-size: 12px;
    }

    .gr_custom_rating_ {
      font-size: 11px;
    }

    .gr_custom_tags_ {
      font-size: 10px;
      color: #829074;
    }

    a {
      color: #51483D;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div id="gr_custom_widget_">
    <div class="gr_custom_container_">
    </div>
  </div>

  <script
    src="https://www.goodreads.com/review/custom_widget/201101484.Faae's%20bookshelf:%20to-read?cover_position=left&cover_size=medium&num_books=8&order=d&shelf=to-read&sort=date_added&widget_bg_transparent=1"
    type="text/javascript"
    charset="utf-8">
  </script>

</body>
</html>
