<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 10px;
      background: transparent;
      font-family: Georgia, "Times New Roman", serif;
      color: #51483D;
    }

    /* ─────────────────────────────
       ATHENAEUM FRAME
    ───────────────────────────── */

    .athenaeum-widget {
      width: 100%;
      padding: 18px 20px 16px;

      background: linear-gradient(
        180deg,
        #FFFFFF 0%,
        #FDFCF8 100%
      );

      border: 1px solid #B68B45;
      outline: 1px solid #DED5BD;
      outline-offset: -5px;
    }

    /* ─────────────────────────────
       HEADER
    ───────────────────────────── */

    .widget-heading {
      text-align: center;
      margin-bottom: 18px;
    }

    .widget-heading .ornament {
      color: #B68B45;
      font-size: 10px;
      margin-bottom: 4px;
    }

    .widget-heading h1 {
      margin: 0;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
      font-weight: normal;

      letter-spacing: 0.14em;
      text-transform: uppercase;

      color: #51483D;
    }

    .widget-heading p {
      margin: 4px 0 0;

      font-size: 11px;
      font-style: italic;

      color: #829074;
    }

    /* ─────────────────────────────
       GOODREADS BOOKSHELF
    ───────────────────────────── */

    .gr_custom_container_ {
      width: 100% !important;

      padding: 0 !important;
      margin: 0 !important;

      border: none !important;
      background: transparent !important;

      display: flex !important;
      flex-wrap: wrap;

      align-items: flex-start;
      justify-content: space-between;

      gap: 16px;
    }

    /* Hide Goodreads' own header/logo */

    .gr_custom_header_,
    .gr_custom_container_ > center,
    .gr_custom_container_ > br {
      display: none !important;
    }

    /* ─────────────────────────────
       INDIVIDUAL BOOK
    ───────────────────────────── */

    .gr_custom_each_container_ {
      width: calc(20% - 13px) !important;
      min-width: 0;

      clear: none !important;
      float: none !important;

      margin: 0 !important;
      padding: 0 !important;

      border: none !important;
      overflow: visible !important;

      text-align: center;
    }

    /* ─────────────────────────────
       BOOK COVER
    ───────────────────────────── */

    .gr_custom_book_container_ {
      float: none !important;

      width: 100% !important;
      height: 180px !important;

      margin: 0 0 8px !important;

      display: flex;
      justify-content: center;
      align-items: flex-end;

      overflow: hidden !important;
    }

    .gr_custom_book_container_ img {
      display: block;

      height: 175px !important;
      width: auto !important;
      max-width: 120px !important;

      object-fit: cover;

      margin: 0 auto;
    }

    /* ─────────────────────────────
       BOOK TITLE
    ───────────────────────────── */

    .gr_custom_title_ {
      height: 49px;

      margin: 0 0 4px !important;

      font-size: 13px !important;
      line-height: 1.25;

      overflow: hidden;

      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    .gr_custom_title_ a {
      color: #51483D !important;
      text-decoration: none !important;
    }

    .gr_custom_title_ a:hover {
      text-decoration: underline !important;
    }

    /* ─────────────────────────────
       AUTHOR
    ───────────────────────────── */

    .gr_custom_author_ {
      font-size: 10.5px !important;
      line-height: 1.3;

      color: #829074 !important;
    }

    .gr_custom_author_ a {
      color: #829074 !important;
      text-decoration: none !important;
    }

    /* ─────────────────────────────
       HIDE GOODREADS CLUTTER
    ───────────────────────────── */

    .gr_custom_rating_,
    .gr_custom_tags_,
    .gr_custom_review_ {
      display: none !important;
    }

    /* ─────────────────────────────
       EXTRA BOOKS
    ───────────────────────────── */

    .extra-book {
      display: none !important;
    }

    body.expanded .extra-book {
      display: block !important;
    }

    /* ─────────────────────────────
       FOOTER
    ───────────────────────────── */

    .widget-footer {
      text-align: center;
      margin-top: 10px;
    }

    .footer-ornament {
      display: flex;

      justify-content: center;
      align-items: center;

      gap: 7px;

      margin-bottom: 7px;
    }

    .footer-ornament span {
      display: block;

      width: 34px;
      height: 1px;

      background: #C8B788;
    }

    .footer-ornament b {
      color: #B68B45;

      font-size: 8px;
      font-weight: normal;
    }

    /* ─────────────────────────────
       SHOW MORE BUTTON
    ───────────────────────────── */

    #toggleBooks {
      display: none;

      margin: 0 auto;
      padding: 4px 12px;

      border: none;
      background: transparent;

      color: #70433F;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 11px;
      font-style: italic;

      cursor: pointer;
    }

    #toggleBooks:hover {
      text-decoration: underline;
    }

    /* ─────────────────────────────
       RESPONSIVE
    ───────────────────────────── */

    @media (max-width: 700px) {
      .gr_custom_each_container_ {
        width: calc(33.333% - 12px) !important;
      }
    }

    @media (max-width: 460px) {
      .gr_custom_each_container_ {
        width: calc(50% - 8px) !important;
      }
    }
  </style>
</head>

<body>

  <section class="athenaeum-widget">

    <header class="widget-heading">

      <div class="ornament">
        ✦
      </div>

      <h1>
        Recently Shelved
      </h1>

      <p>
        from my Goodreads shelf
      </p>

    </header>


    <div id="gr_custom_widget_">

      <div class="gr_custom_container_">
      </div>

    </div>


    <div class="widget-footer">

      <div class="footer-ornament">

        <span></span>

        <b>✦</b>

        <span></span>

      </div>

      <button id="toggleBooks">
        Show more
      </button>

    </div>

  </section>


  <!-- GOODREADS FEED -->

  <script
    src="https://www.goodreads.com/review/custom_widget/201101484.Faae's%20bookshelf:%20to-read?cover_position=left&cover_size=medium&num_books=100&order=d&shelf=to-read&sort=date_added&widget_bg_transparent=1"
    type="text/javascript"
    charset="utf-8">
  </script>


  <!-- SHOW MORE / SHOW LESS -->

  <script>
    let initialized = false;

    function setupBookToggle() {

      if (initialized) return;

      const books = document.querySelectorAll(
        ".gr_custom_each_container_"
      );

      const button = document.getElementById(
        "toggleBooks"
      );

      if (!books.length) return;


      /* Hide everything after the
         five newest books */

      books.forEach((book, index) => {

        if (index >= 5) {
          book.classList.add("extra-book");
        }

      });


      /* Only show button when
         more than five books exist */

      if (books.length > 5) {
        button.style.display = "block";
      }


      /* Expand / collapse shelf */

      button.addEventListener("click", () => {

        const expanded =
          document.body.classList.toggle(
            "expanded"
          );

        button.textContent =
          expanded
            ? "Show less"
            : "Show more";

      });


      initialized = true;
    }


    /* Goodreads injects the books
       after the page loads, so wait
       until they appear */

    const observer =
      new MutationObserver(() => {

        const books =
          document.querySelectorAll(
            ".gr_custom_each_container_"
          );

        if (books.length > 0) {
          setupBookToggle();
        }

      });


    observer.observe(
      document.body,
      {
        childList: true,
        subtree: true
      }
    );
  </script>

</body>
</html>
