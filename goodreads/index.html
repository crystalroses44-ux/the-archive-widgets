<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
  margin: 0;
  padding: 10px;
  background: transparent;
  font-family: Georgia, "Times New Roman", serif;
  color: #51483D;
}

.athenaeum-widget {
  position: relative;
  width: 100%;
  padding: 20px 22px 17px;

  background: linear-gradient(
    180deg,
    #ffffff 0%,
    #fdfcf8 100%
  );

  border: 1px solid #B68B45;
  outline: 1px solid #DED5BD;
  outline-offset: -5px;
}

.widget-heading {
  text-align: center;
  margin-bottom: 20px;
}

.widget-heading .ornament {
  color: #B68B45;
  font-size: 11px;
  line-height: 1;
  margin-bottom: 5px;
}

.widget-heading h1 {
  margin: 0;
  font-size: 17px;
  font-weight: normal;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #51483D;
}

.widget-heading p {
  margin: 4px 0 0;
  font-size: 11px;
  font-style: italic;
  letter-spacing: 0.04em;
  color: #829074;
}

.widget-footer {
  text-align: center;
  margin-top: 19px;
}

.footer-ornament {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  margin-bottom: 9px;
}

.footer-ornament span {
  display: block;
  width: 34px;
  height: 1px;
  background: #C8B788;
}

.footer-ornament b {
  color: #B68B45;
  font-size: 8px;
  font-weight: normal;
}

    /* GOODREADS CONTAINER */

    .gr_custom_container_ {
      width: 100% !important;
      padding: 0 !important;
      margin: 0 !important;
      border: none !important;
      background: transparent !important;

      display: flex !important;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 18px;
    }

    /* Hide Goodreads' own heading + logo */

    .gr_custom_header_,
    .gr_custom_container_ > center,
    .gr_custom_container_ > br {
      display: none !important;
    }

    /* EACH BOOK */

    .gr_custom_each_container_ {
      width: calc(20% - 15px) !important;
      min-width: 0;

      clear: none !important;
      float: none !important;

      margin: 0 !important;
      padding: 0 !important;

      border: none !important;
      overflow: visible !important;

      text-align: center;
    }

    /* COVER */

    .gr_custom_book_container_ {
      float: none !important;
      width: 100% !important;
      height: 170px !important;

      margin: 0 0 9px 0 !important;

      display: flex;
      justify-content: center;
      align-items: flex-end;

      overflow: hidden !important;
    }

    .gr_custom_book_container_ img {
      display: block;

      width: auto !important;
      max-width: 112px !important;
      height: 165px !important;

      object-fit: cover;

      margin: 0 auto;
    }

    /* TITLES */

    .gr_custom_title_ {
      font-size: 14px !important;
      line-height: 1.25;
      margin: 0 0 3px 0 !important;
    }

    .gr_custom_title_ a {
      color: #51483D !important;
      text-decoration: none !important;
    }

    .gr_custom_title_ a:hover {
      text-decoration: underline !important;
    }

    /* AUTHORS */

    .gr_custom_author_ {
      font-size: 11px !important;
      line-height: 1.3;
      color: #829074 !important;
    }

    .gr_custom_author_ a {
      color: #829074 !important;
      text-decoration: none !important;
    }

    /* Remove Goodreads rating stars */

    .gr_custom_rating_ {
      display: none !important;
    }

    .gr_custom_tags_,
    .gr_custom_review_ {
      display: none !important;
    }

    /* HIDE EVERYTHING AFTER BOOK FIVE */

    .extra-book {
      display: none !important;
    }

    body.expanded .extra-book {
      display: block !important;
    }

    /* BUTTON */

  #toggleBooks {
  display: none;

  margin: 0 auto !important;
  padding: 5px 16px !important;

  border: none !important;
  background: transparent !important;

  color: #70433F !important;

  font-family: Georgia, "Times New Roman", serif;
  font-size: 11px !important;
  font-style: italic;

  cursor: pointer;
}

#toggleBooks:hover {
  background: transparent !important;
  text-decoration: underline;
}
    }

    @media (max-width: 430px) {
      .gr_custom_each_container_ {
        width: calc(50% - 9px) !important;
      }
    }
  </style>
</head>

<body>

  <section class="athenaeum-widget">

    <header class="widget-heading">
      <div class="ornament">✦</div>
      <h1>To Be Read</h1>
      <p>recently added to my shelf</p>
    </header>

    <div id="gr_custom_widget_">
      <div class="gr_custom_container_"></div>
    </div>

    <div class="widget-footer">
      <div class="footer-ornament">
        <span></span>
        <b>✦</b>
        <span></span>
      </div>

      <button id="toggleBooks">
        Show more
      </button>
    </div>

  </section>

  <script
    src="https://www.goodreads.com/review/custom_widget/201101484.Faae's%20bookshelf:%20to-read?cover_position=left&cover_size=medium&num_books=100&order=d&shelf=to-read&sort=date_added&widget_bg_transparent=1"
    type="text/javascript"
    charset="utf-8">
  </script>

  <script>
    function setupBookToggle() {
      const books = document.querySelectorAll(
        ".gr_custom_each_container_"
      );

      const button = document.getElementById("toggleBooks");

      if (!books.length) return;

      books.forEach((book, index) => {
        if (index >= 5) {
          book.classList.add("extra-book");
        }
      });

      if (books.length > 5) {
        button.style.display = "block";
      }

      button.addEventListener("click", () => {
        const expanded =
          document.body.classList.toggle("expanded");

        button.textContent =
          expanded ? "Show less" : "Show more";
      });
    }

    const observer = new MutationObserver(() => {
      const books = document.querySelectorAll(
        ".gr_custom_each_container_"
      );

      if (books.length > 0) {
        setupBookToggle();
        observer.disconnect();
      }
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  </script>

</body>
</html>
