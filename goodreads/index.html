<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 14px;
      background: transparent;
      font-family: Georgia, "Times New Roman", serif;
      color: #51483D;
    }

    /* GOODREADS CONTAINER */

    .gr_custom_container_ {
      width: 100% !important;
      padding: 0 !important;
      margin: 0 !important;
      border: none !important;
      background: transparent !important;

      display: flex !important;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 18px;
    }

    /* Hide Goodreads' own heading + logo */

    .gr_custom_header_,
    .gr_custom_container_ > center,
    .gr_custom_container_ > br {
      display: none !important;
    }

    /* EACH BOOK */

    .gr_custom_each_container_ {
      width: calc(20% - 15px) !important;
      min-width: 0;

      clear: none !important;
      float: none !important;

      margin: 0 !important;
      padding: 0 !important;

      border: none !important;
      overflow: visible !important;

      text-align: center;
    }

    /* COVER */

    .gr_custom_book_container_ {
      float: none !important;
      width: 100% !important;
      height: 170px !important;

      margin: 0 0 9px 0 !important;

      display: flex;
      justify-content: center;
      align-items: flex-end;

      overflow: hidden !important;
    }

    .gr_custom_book_container_ img {
      display: block;

      width: auto !important;
      max-width: 112px !important;
      height: 165px !important;

      object-fit: cover;

      margin: 0 auto;
    }

    /* TITLES */

    .gr_custom_title_ {
      font-size: 14px !important;
      line-height: 1.25;
      margin: 0 0 3px 0 !important;
    }

    .gr_custom_title_ a {
      color: #51483D !important;
      text-decoration: none !important;
    }

    .gr_custom_title_ a:hover {
      text-decoration: underline !important;
    }

    /* AUTHORS */

    .gr_custom_author_ {
      font-size: 11px !important;
      line-height: 1.3;
      color: #829074 !important;
    }

    .gr_custom_author_ a {
      color: #829074 !important;
      text-decoration: none !important;
    }

    /* Remove Goodreads rating stars */

    .gr_custom_rating_ {
      display: none !important;
    }

    .gr_custom_tags_,
    .gr_custom_review_ {
      display: none !important;
    }

    /* HIDE EVERYTHING AFTER BOOK FIVE */

    .extra-book {
      display: none !important;
    }

    body.expanded .extra-book {
      display: block !important;
    }

    /* BUTTON */

    #toggleBooks {
      display: none;

      margin: 20px auto 4px;
      padding: 7px 18px;

      border: 1px solid #B68B45;
      background: #FAF7F0;

      color: #51483D;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;

      cursor: pointer;
    }

    #toggleBooks:hover {
      background: #F3EEE4;
    }

    /* MOBILE / NARROW NOTION EMBEDS */

    @media (max-width: 650px) {
      .gr_custom_each_container_ {
        width: calc(33.333% - 12px) !important;
      }
    }

    @media (max-width: 430px) {
      .gr_custom_each_container_ {
        width: calc(50% - 9px) !important;
      }
    }
  </style>
</head>

<body>

  <section class="athenaeum-widget">

    <header class="widget-heading">
      <div class="ornament">✦</div>
      <h1>To Be Read</h1>
      <p>recently added to my shelf</p>
    </header>

    <div id="gr_custom_widget_">
      <div class="gr_custom_container_"></div>
    </div>

    <div class="widget-footer">
      <div class="footer-ornament">
        <span></span>
        <b>✦</b>
        <span></span>
      </div>

      <button id="toggleBooks">
        Show more
      </button>
    </div>

  </section>

  <script
    src="https://www.goodreads.com/review/custom_widget/201101484.Faae's%20bookshelf:%20to-read?cover_position=left&cover_size=medium&num_books=100&order=d&shelf=to-read&sort=date_added&widget_bg_transparent=1"
    type="text/javascript"
    charset="utf-8">
  </script>

  <script>
    function setupBookToggle() {
      const books = document.querySelectorAll(
        ".gr_custom_each_container_"
      );

      const button = document.getElementById("toggleBooks");

      if (!books.length) return;

      books.forEach((book, index) => {
        if (index >= 5) {
          book.classList.add("extra-book");
        }
      });

      if (books.length > 5) {
        button.style.display = "block";
      }

      button.addEventListener("click", () => {
        const expanded =
          document.body.classList.toggle("expanded");

        button.textContent =
          expanded ? "Show less" : "Show more";
      });
    }

    const observer = new MutationObserver(() => {
      const books = document.querySelectorAll(
        ".gr_custom_each_container_"
      );

      if (books.length > 0) {
        setupBookToggle();
        observer.disconnect();
      }
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  </script>

</body>
</html>
