<link rel="stylesheet" href="style.css">

<div class="loose-leaves-widget">
  <div class="inner-frame">
    <div class="corner corner-tl">✦</div>
    <div class="corner corner-tr">☾</div>

    <div class="title">Loose Leaves</div>

    <div class="subtitle">
      quick notes, questions, ideas,<br>
      & things to investigate
    </div>

    <div class="divider">
      <span></span>
      <span></span>
    </div>

    <!-- Editing view -->
    <textarea
      id="looseLeaves"
      placeholder="Begin writing..."
      aria-label="Loose Leaves notes"
    ></textarea>

    <!-- Clean reading view -->
    <div
      id="looseLeavesDisplay"
      class="loose-leaves-display"
      aria-label="Saved Loose Leaves notes"
      tabindex="0"
    ></div>

    <div class="footer">
      <span id="saveStatus">saved locally</span>
      <span>✦</span>
      <button id="clearNotes" type="button">clear</button>
    </div>

    <div class="corner corner-br">✦</div>
  </div>
</div>

<script src="script.js"></script>
