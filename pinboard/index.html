<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>The Archive Pinboard</title>

  <style>

    :root {
      --ivory: #FFFDF8;
      --paper: #FAF7F0;
      --forest: #263D35;
      --sage: #829074;
      --gold: #B68B45;
      --gold-soft: #D8C39A;
      --brown: #51483D;
      --rose: #B77B78;
      --cork: #D7C3A2;
      --cork-dark: #BFA37A;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: transparent;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      color: var(--brown);
    }

    body {
      padding: 8px;
    }

    button,
    input,
    textarea {
      font: inherit;
    }


    /* ---------------------------------
       WIDGET
    --------------------------------- */

    .widget {
      width: 100%;

      background: var(--ivory);

      border: 1px solid var(--gold);

      outline: 1px solid rgba(182, 139, 69, 0.28);
      outline-offset: -5px;

      padding: 15px;

      position: relative;
    }

    .widget::before,
    .widget::after {
      content: "✦";

      position: absolute;

      top: 8px;

      color: var(--gold-soft);

      font-size: 9px;
    }

    .widget::before {
      left: 10px;
    }

    .widget::after {
      right: 10px;
    }


    /* ---------------------------------
       HEADER
    --------------------------------- */

    .header {
      text-align: center;

      margin-bottom: 11px;
    }

    .header-star {
      color: var(--gold);

      font-size: 9px;

      margin-bottom: 4px;
    }

    .header h1 {
      margin: 0;

      color: var(--forest);

      font-size: 14px;

      font-weight: normal;

      letter-spacing: 0.16em;

      text-transform: uppercase;
    }

    .subtitle {
      margin-top: 4px;

      color: var(--sage);

      font-size: 9px;

      font-style: italic;
    }


    /* ---------------------------------
       TOOLBAR
    --------------------------------- */

    .toolbar {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 8px;

      margin-bottom: 9px;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;

      align-items: center;

      gap: 6px;
    }

    .tool-button {
      border: 1px solid #D5CAB0;

      background: #FBF8EF;

      padding: 5px 8px;

      color: #70433F;

      font-size: 9px;

      cursor: pointer;

      transition:
        background 150ms ease,
        border-color 150ms ease;
    }

    .tool-button:hover {
      background: #F3EEDF;

      border-color: var(--gold);
    }

    .clear-button {
      color: var(--rose);
    }

    #fileInput {
      display: none;
    }


    /* ---------------------------------
       BOARD FRAME
    --------------------------------- */

    .board-frame {
      border: 1px solid var(--gold-soft);

      padding: 6px;

      background: #F7F1E5;

      box-shadow:
        inset 0 0 0 1px rgba(182, 139, 69, 0.12);
    }

    .board {
      width: 100%;

      height: 500px;

      position: relative;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 20% 30%,
          rgba(255,255,255,0.14),
          transparent 24%
        ),
        radial-gradient(
          circle at 80% 65%,
          rgba(81,72,61,0.05),
          transparent 26%
        ),
        repeating-linear-gradient(
          45deg,
          rgba(255,255,255,0.02) 0px,
          rgba(255,255,255,0.02) 3px,
          rgba(81,72,61,0.025) 4px,
          rgba(81,72,61,0.025) 5px
        ),
        linear-gradient(
          135deg,
          var(--cork),
          #DCC8A8
        );

      border: 1px solid var(--cork-dark);
    }


    /* ---------------------------------
       EMPTY STATE
    --------------------------------- */

    .empty-state {
      position: absolute;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      pointer-events: none;
    }

    .empty-card {
      max-width: 240px;

      padding: 16px 18px;

      background: rgba(255, 253, 248, 0.82);

      border: 1px solid rgba(182, 139, 69, 0.65);

      text-align: center;

      color: var(--sage);

      font-size: 10px;

      line-height: 1.5;

      box-shadow:
        0 4px 12px rgba(81, 72, 61, 0.08);
    }

    .empty-card strong {
      display: block;

      margin-bottom: 5px;

      color: var(--forest);

      font-weight: normal;

      letter-spacing: 0.08em;

      text-transform: uppercase;

      font-size: 9px;
    }


    /* ---------------------------------
       SHARED BOARD ITEM
    --------------------------------- */

    .board-item {
      position: absolute;

      user-select: none;

      transform-origin: center center;
    }


    /* ---------------------------------
       PHOTO
    --------------------------------- */

    .photo {
      width: 150px;

      min-width: 80px;

      touch-action: none;
    }

    .photo-shell {
      width: 100%;

      position: relative;

      padding: 6px 6px 17px;

      background: #FFFDF8;

      border: 1px solid rgba(81, 72, 61, 0.15);

      box-shadow:
        0 5px 11px rgba(81, 72, 61, 0.22);

      cursor: grab;
    }

    .photo-shell:active {
      cursor: grabbing;
    }

    .photo img {
      display: block;

      width: 100%;

      max-height: 310px;

      object-fit: cover;

      pointer-events: none;
    }


    /* ---------------------------------
       PHOTO DECORATIONS
    --------------------------------- */

    .decoration {
      position: absolute;

      pointer-events: none;

      z-index: 5;
    }


    /* BRASS PIN */

    .photo[data-decoration="pin"] .decoration {
      width: 10px;
      height: 10px;

      left: 50%;
      top: -5px;

      transform: translateX(-50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 30%,
          #F8E7BA,
          var(--gold) 60%,
          #84642D
        );

      box-shadow:
        0 1px 2px rgba(81,72,61,0.35);
    }


    /* MASKING TAPE */

    .photo[data-decoration="tape"] .decoration {
      width: 52px;
      height: 17px;

      left: 50%;
      top: -9px;

      transform:
        translateX(-50%)
        rotate(-2deg);

      background:
        rgba(229, 211, 170, 0.84);

      border-left: 1px solid rgba(167, 140, 91, 0.23);
      border-right: 1px solid rgba(167, 140, 91, 0.23);

      box-shadow:
        0 1px 2px rgba(81,72,61,0.10);
    }


    /* PAPERCLIP */

    .photo[data-decoration="clip"] .decoration {
      width: 11px;
      height: 29px;

      left: 14px;
      top: -11px;

      transform: rotate(-13deg);

      border: 2px solid #A88A4E;

      border-radius: 7px;

      background: transparent;

      box-shadow:
        inset 0 0 0 2px rgba(255,253,248,0.6);
    }

    .photo[data-decoration="clip"] .decoration::after {
      content: "";

      position: absolute;

      width: 5px;
      height: 20px;

      left: 1px;
      top: 3px;

      border: 1px solid #C0A261;

      border-radius: 5px;
    }


    /* ---------------------------------
       PHOTO CONTROLS
    --------------------------------- */

    .photo-controls {
      position: absolute;

      top: -25px;
      right: 0;

      display: flex;

      gap: 3px;

      opacity: 0;

      pointer-events: none;

      transition: opacity 120ms ease;
    }

    .photo.active .photo-controls {
      opacity: 1;

      pointer-events: auto;
    }

    .photo-control,
    .note-control {
      width: 21px;
      height: 21px;

      display: grid;

      place-items: center;

      padding: 0;

      border: 1px solid var(--gold-soft);

      background: var(--ivory);

      color: var(--brown);

      font-size: 10px;

      cursor: pointer;

      box-shadow:
        0 2px 5px rgba(81,72,61,0.11);
    }

    .photo-control:hover,
    .note-control:hover {
      background: #F4EEDF;
    }

    .photo-control.delete,
    .note-control.delete {
      color: var(--rose);
    }

    .style-control {
      color: var(--gold);
    }


    /* ---------------------------------
       RESIZE HANDLE
    --------------------------------- */

    .resize-handle {
      position: absolute;

      width: 15px;
      height: 15px;

      right: -6px;
      bottom: -6px;

      cursor: nwse-resize;

      opacity: 0;

      pointer-events: none;
    }

    .resize-handle::after {
      content: "";

      position: absolute;

      right: 2px;
      bottom: 2px;

      width: 7px;
      height: 7px;

      border-right: 1px solid var(--gold);
      border-bottom: 1px solid var(--gold);
    }

    .photo.active .resize-handle,
    .note.active .resize-handle {
      opacity: 1;

      pointer-events: auto;
    }


    /* ---------------------------------
       NOTES
    --------------------------------- */

    .note {
      width: 170px;

      min-width: 110px;

      touch-action: none;
    }

    .note-shell {
      width: 100%;

      min-height: 125px;

      position: relative;

      padding: 19px 12px 14px;

      background:
        linear-gradient(
          145deg,
          #FFF8D8,
          #F8EFC7
        );

      border: 1px solid #D8C789;

      box-shadow:
        0 5px 12px rgba(81,72,61,0.20);
    }

    .note-shell::after {
      content: "";

      position: absolute;

      inset: 0;

      pointer-events: none;

      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 23px,
          rgba(130,144,116,0.10) 24px
        );
    }

    .note-grip {
      position: absolute;

      left: 10px;
      right: 10px;
      top: 5px;

      height: 11px;

      z-index: 3;

      cursor: grab;

      text-align: center;

      color: rgba(182,139,69,0.60);

      font-size: 7px;

      letter-spacing: 0.15em;
    }

    .note-grip:active {
      cursor: grabbing;
    }

    .note textarea {
      position: relative;

      z-index: 2;

      display: block;

      width: 100%;
      height: 92px;

      resize: none;

      border: 0;

      outline: 0;

      padding: 3px;

      background: transparent;

      color: #51483D;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 11px;

      line-height: 1.55;
    }

    .note textarea::placeholder {
      color: rgba(81,72,61,0.45);

      font-style: italic;
    }

    .note-controls {
      position: absolute;

      top: -25px;
      right: 0;

      display: flex;

      gap: 3px;

      opacity: 0;

      pointer-events: none;

      transition: opacity 120ms ease;
    }

    .note.active .note-controls {
      opacity: 1;

      pointer-events: auto;
    }


    /* ---------------------------------
       FOOTER
    --------------------------------- */

    .footer {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-top: 8px;

      color: var(--sage);

      font-size: 8px;

      letter-spacing: 0.04em;
    }

    .saved-status {
      font-style: italic;
    }


    /* ---------------------------------
       MOBILE
    --------------------------------- */

    @media (max-width: 500px) {

      body {
        padding: 4px;
      }

      .widget {
        padding: 13px 10px 10px;
      }

      .board {
        height: 470px;
      }

      .toolbar {
        align-items: stretch;
      }

      .tool-button {
        padding: 5px 6px;

        font-size: 8px;
      }

      .photo {
        width: 125px;
      }

      .note {
        width: 145px;
      }

    }

  </style>
</head>


<body>

  <section class="widget">

    <header class="header">

      <div class="header-star">
        ✦
      </div>

      <h1>
        Pinboard
      </h1>

      <div class="subtitle">
        fragments, references & things worth keeping
      </div>

    </header>


    <div class="toolbar">

      <div class="toolbar-left">

        <label
          class="tool-button"
          for="fileInput"
        >
          + Add Images
        </label>

        <input
          id="fileInput"
          type="file"
          accept="image/*"
          multiple
        >

        <button
          class="tool-button"
          id="addNoteButton"
          type="button"
        >
          + Note
        </button>

      </div>


      <div class="toolbar-right">

        <button
          class="tool-button clear-button"
          id="clearBoardButton"
          type="button"
        >
          Clear
        </button>

      </div>

    </div>


    <div class="board-frame">

      <div
        class="board"
        id="board"
      >

        <div
          class="empty-state"
          id="emptyState"
        >

          <div class="empty-card">

            <strong>
              The board is waiting
            </strong>

            Add images or notes, then arrange
            them however you like.

          </div>

        </div>

      </div>

    </div>


    <footer class="footer">

      <span>
        CLICK AN ITEM TO EDIT ✦
      </span>

      <span
        class="saved-status"
        id="savedStatus"
      >
        Saved locally
      </span>

    </footer>

  </section>


  <script>

    /* ---------------------------------
       DATABASE

       We intentionally keep the SAME
       database + store as the first
       version so existing photos remain.
    --------------------------------- */

    const DB_NAME =
      "archive-pinboard";

    const STORE_NAME =
      "photos";

    const DB_VERSION = 1;

    let database;


    function openDatabase() {

      return new Promise(
        (resolve, reject) => {

          const request =
            indexedDB.open(
              DB_NAME,
              DB_VERSION
            );


          request.onupgradeneeded =
            event => {

              const db =
                event.target.result;


              if (
                !db.objectStoreNames.contains(
                  STORE_NAME
                )
              ) {

                db.createObjectStore(
                  STORE_NAME,
                  {
                    keyPath: "id"
                  }
                );

              }

            };


          request.onsuccess =
            event => {

              database =
                event.target.result;

              resolve(database);

            };


          request.onerror =
            () => {

              reject(
                request.error
              );

            };

        }
      );

    }


    function saveItemData(item) {

      return new Promise(
        (resolve, reject) => {

          const transaction =
            database.transaction(
              STORE_NAME,
              "readwrite"
            );


          const store =
            transaction.objectStore(
              STORE_NAME
            );


          store.put(item);


          transaction.oncomplete =
            () => resolve();


          transaction.onerror =
            () => reject(
              transaction.error
            );

        }
      );

    }


    function getAllItems() {

      return new Promise(
        (resolve, reject) => {

          const transaction =
            database.transaction(
              STORE_NAME,
              "readonly"
            );


          const store =
            transaction.objectStore(
              STORE_NAME
            );


          const request =
            store.getAll();


          request.onsuccess =
            () => {

              resolve(
                request.result || []
              );

            };


          request.onerror =
            () => {

              reject(
                request.error
              );

            };

        }
      );

    }


    function deleteItemData(id) {

      return new Promise(
        (resolve, reject) => {

          const transaction =
            database.transaction(
              STORE_NAME,
              "readwrite"
            );


          transaction
            .objectStore(
              STORE_NAME
            )
            .delete(id);


          transaction.oncomplete =
            () => resolve();


          transaction.onerror =
            () => reject(
              transaction.error
            );

        }
      );

    }


    function clearItemData() {

      return new Promise(
        (resolve, reject) => {

          const transaction =
            database.transaction(
              STORE_NAME,
              "readwrite"
            );


          transaction
            .objectStore(
              STORE_NAME
            )
            .clear();


          transaction.oncomplete =
            () => resolve();


          transaction.onerror =
            () => reject(
              transaction.error
            );

        }
      );

    }


    /* ---------------------------------
       STATE
    --------------------------------- */

    const board =
      document.getElementById(
        "board"
      );

    const fileInput =
      document.getElementById(
        "fileInput"
      );

    const addNoteButton =
      document.getElementById(
        "addNoteButton"
      );

    const emptyState =
      document.getElementById(
        "emptyState"
      );

    const clearBoardButton =
      document.getElementById(
        "clearBoardButton"
      );

    const savedStatus =
      document.getElementById(
        "savedStatus"
      );


    let activeItem = null;

    let highestZ = 1;


    /* ---------------------------------
       EMPTY STATE
    --------------------------------- */

    function updateEmptyState() {

      const items =
        board.querySelectorAll(
          ".board-item"
        );


      emptyState.style.display =
        items.length
          ? "none"
          : "flex";

    }


    /* ---------------------------------
       STATUS
    --------------------------------- */

    function showSaving() {

      savedStatus.textContent =
        "Saving…";

    }


    function showSaved() {

      savedStatus.textContent =
        "Saved locally";

    }


    /* ---------------------------------
       ACTIVATE ITEM
    --------------------------------- */

    function activateItem(
      element,
      itemData
    ) {

      if (
        activeItem
        && activeItem !== element
      ) {

        activeItem
          .classList
          .remove(
            "active"
          );

      }


      activeItem =
        element;


      element
        .classList
        .add(
          "active"
        );


      element.style.zIndex =
        ++highestZ;


      itemData.z =
        highestZ;


      saveItemData(
        itemData
      );

    }


    board.addEventListener(
      "pointerdown",
      event => {

        if (
          !event.target.closest(
            ".board-item"
          )
        ) {

          if (
            activeItem
          ) {

            activeItem
              .classList
              .remove(
                "active"
              );

            activeItem = null;

          }

        }

      }
    );


    /* ---------------------------------
       IMAGE UPLOAD
    --------------------------------- */

    fileInput.addEventListener(
      "change",
      async event => {

        const files =
          Array.from(
            event.target.files || []
          );


        for (
          const file of files
        ) {

          if (
            !file.type.startsWith(
              "image/"
            )
          ) {

            continue;

          }


          const id =
            crypto.randomUUID();


          const photoData = {

            id,

            type: "photo",

            file,

            x:
              20
              + Math.random()
              * 90,

            y:
              25
              + Math.random()
              * 85,

            width:
              135
              + Math.random()
              * 25,

            rotation:
              Math.random()
              * 8
              - 4,

            decoration:
              "pin",

            z:
              ++highestZ

          };


          await saveItemData(
            photoData
          );


          createPhotoElement(
            photoData
          );

        }


        fileInput.value = "";


        updateEmptyState();

        showSaved();

      }
    );


    /* ---------------------------------
       CREATE PHOTO
    --------------------------------- */

    function createPhotoElement(
      photoData
    ) {

      /* Compatibility with photos saved
         by the original pinboard version */

      if (!photoData.type) {
        photoData.type =
          "photo";
      }

      if (!photoData.decoration) {
        photoData.decoration =
          "pin";
      }


      const photo =
        document.createElement(
          "div"
        );


      photo.className =
        "board-item photo";


      photo.dataset.id =
        photoData.id;


      photo.dataset.decoration =
        photoData.decoration;


      photo.style.left =
        `${photoData.x ?? 30}px`;


      photo.style.top =
        `${photoData.y ?? 30}px`;


      photo.style.width =
        `${photoData.width || 150}px`;


      photo.style.zIndex =
        photoData.z || 1;


      photo.style.transform =
        `rotate(${photoData.rotation || 0}deg)`;


      highestZ =
        Math.max(
          highestZ,
          photoData.z || 1
        );


      const shell =
        document.createElement(
          "div"
        );


      shell.className =
        "photo-shell";


      const img =
        document.createElement(
          "img"
        );


      const objectUrl =
        URL.createObjectURL(
          photoData.file
        );


      img.src =
        objectUrl;


      img.alt =
        "Pinned image";


      img.onload =
        () => {

          URL.revokeObjectURL(
            objectUrl
          );

        };


      const decoration =
        document.createElement(
          "div"
        );


      decoration.className =
        "decoration";


      const controls =
        document.createElement(
          "div"
        );


      controls.className =
        "photo-controls";


      controls.innerHTML = `

        <button
          class="photo-control rotate-left"
          type="button"
          title="Rotate left"
        >
          ↶
        </button>

        <button
          class="photo-control rotate-right"
          type="button"
          title="Rotate right"
        >
          ↷
        </button>

        <button
          class="photo-control style-control"
          type="button"
          title="Change pin style"
        >
          ✦
        </button>

        <button
          class="photo-control delete"
          type="button"
          title="Delete"
        >
          ×
        </button>

      `;


      const resizeHandle =
        document.createElement(
          "div"
        );


      resizeHandle.className =
        "resize-handle";


      shell.appendChild(img);
      shell.appendChild(decoration);
      shell.appendChild(controls);
      shell.appendChild(
        resizeHandle
      );


      photo.appendChild(
        shell
      );


      board.appendChild(
        photo
      );


      setupPhotoInteractions(
        photo,
        photoData
      );


      updateEmptyState();

    }


    /* ---------------------------------
       PHOTO INTERACTIONS
    --------------------------------- */

    function setupPhotoInteractions(
      photo,
      photoData
    ) {

      const shell =
        photo.querySelector(
          ".photo-shell"
        );


      const rotateLeft =
        photo.querySelector(
          ".rotate-left"
        );


      const rotateRight =
        photo.querySelector(
          ".rotate-right"
        );


      const styleButton =
        photo.querySelector(
          ".style-control"
        );


      const deleteButton =
        photo.querySelector(
          ".delete"
        );


      const resizeHandle =
        photo.querySelector(
          ".resize-handle"
        );


      /* DRAG */

      shell.addEventListener(
        "pointerdown",
        event => {

          if (
            event.target.closest(
              ".photo-control"
            )
            ||
            event.target.closest(
              ".resize-handle"
            )
          ) {

            return;

          }


          activateItem(
            photo,
            photoData
          );


          event.preventDefault();


          startDragging(
            event,
            photo,
            photoData,
            shell
          );

        }
      );


      /* RESIZE */

      resizeHandle.addEventListener(
        "pointerdown",
        event => {

          event.stopPropagation();

          event.preventDefault();


          activateItem(
            photo,
            photoData
          );


          startResizing(
            event,
            photo,
            photoData,
            resizeHandle,
            80,
            330
          );

        }
      );


      /* ROTATE LEFT */

      rotateLeft.addEventListener(
        "click",
        async event => {

          event.stopPropagation();


          photoData.rotation =
            (photoData.rotation || 0)
            - 3;


          photo.style.transform =
            `rotate(${photoData.rotation}deg)`;


          showSaving();


          await saveItemData(
            photoData
          );


          showSaved();

        }
      );


      /* ROTATE RIGHT */

      rotateRight.addEventListener(
        "click",
        async event => {

          event.stopPropagation();


          photoData.rotation =
            (photoData.rotation || 0)
            + 3;


          photo.style.transform =
            `rotate(${photoData.rotation}deg)`;


          showSaving();


          await saveItemData(
            photoData
          );


          showSaved();

        }
      );


      /* DECORATION STYLE */

      styleButton.addEventListener(
        "click",
        async event => {

          event.stopPropagation();


          const styles =
            [
              "pin",
              "tape",
              "clip"
            ];


          const currentIndex =
            styles.indexOf(
              photoData.decoration
            );


          const nextIndex =
            (
              currentIndex + 1
            )
            % styles.length;


          photoData.decoration =
            styles[nextIndex];


          photo.dataset.decoration =
            photoData.decoration;


          const labels = {
            pin:
              "Brass pin",
            tape:
              "Masking tape",
            clip:
              "Paperclip"
          };


          styleButton.title =
            `Decoration: ${labels[photoData.decoration]}`;


          showSaving();


          await saveItemData(
            photoData
          );


          showSaved();

        }
      );


      /* DELETE */

      deleteButton.addEventListener(
        "click",
        async event => {

          event.stopPropagation();


          photo.remove();


          if (
            activeItem === photo
          ) {

            activeItem = null;

          }


          await deleteItemData(
            photoData.id
          );


          updateEmptyState();

          showSaved();

        }
      );

    }


    /* ---------------------------------
       ADD NOTE
    --------------------------------- */

    addNoteButton.addEventListener(
      "click",
      async () => {

        const noteData = {

          id:
            crypto.randomUUID(),

          type:
            "note",

          text:
            "",

          x:
            50
            + Math.random()
            * 100,

          y:
            45
            + Math.random()
            * 75,

          width:
            170,

          rotation:
            Math.random()
            * 4
            - 2,

          z:
            ++highestZ

        };


        await saveItemData(
          noteData
        );


        const note =
          createNoteElement(
            noteData
          );


        activateItem(
          note,
          noteData
        );


        const textarea =
          note.querySelector(
            "textarea"
          );


        textarea.focus();


        updateEmptyState();

      }
    );


    /* ---------------------------------
       CREATE NOTE
    --------------------------------- */

    function createNoteElement(
      noteData
    ) {

      const note =
        document.createElement(
          "div"
        );


      note.className =
        "board-item note";


      note.dataset.id =
        noteData.id;


      note.style.left =
        `${noteData.x ?? 50}px`;


      note.style.top =
        `${noteData.y ?? 50}px`;


      note.style.width =
        `${noteData.width || 170}px`;


      note.style.zIndex =
        noteData.z || 1;


      note.style.transform =
        `rotate(${noteData.rotation || 0}deg)`;


      highestZ =
        Math.max(
          highestZ,
          noteData.z || 1
        );


      const shell =
        document.createElement(
          "div"
        );


      shell.className =
        "note-shell";


      const grip =
        document.createElement(
          "div"
        );


      grip.className =
        "note-grip";


      grip.textContent =
        "✦  ✦  ✦";


      const textarea =
        document.createElement(
          "textarea"
        );


      textarea.placeholder =
        "Write something worth keeping…";


      textarea.value =
        noteData.text || "";


      const controls =
        document.createElement(
          "div"
        );


      controls.className =
        "note-controls";


      controls.innerHTML = `

        <button
          class="note-control rotate-left"
          type="button"
          title="Rotate left"
        >
          ↶
        </button>

        <button
          class="note-control rotate-right"
          type="button"
          title="Rotate right"
        >
          ↷
        </button>

        <button
          class="note-control delete"
          type="button"
          title="Delete note"
        >
          ×
        </button>

      `;


      const resizeHandle =
        document.createElement(
          "div"
        );


      resizeHandle.className =
        "resize-handle";


      shell.appendChild(grip);
      shell.appendChild(textarea);
      shell.appendChild(controls);
      shell.appendChild(
        resizeHandle
      );


      note.appendChild(shell);


      board.appendChild(note);


      setupNoteInteractions(
        note,
        noteData
      );


      updateEmptyState();


      return note;

    }


    /* ---------------------------------
       NOTE INTERACTIONS
    --------------------------------- */

    function setupNoteInteractions(
      note,
      noteData
    ) {

      const textarea =
        note.querySelector(
          "textarea"
        );


      const grip =
        note.querySelector(
          ".note-grip"
        );


      const rotateLeft =
        note.querySelector(
          ".rotate-left"
        );


      const rotateRight =
        note.querySelector(
          ".rotate-right"
        );


      const deleteButton =
        note.querySelector(
          ".delete"
        );


      const resizeHandle =
        note.querySelector(
          ".resize-handle"
        );


      /* ACTIVATE WHILE EDITING */

      textarea.addEventListener(
        "pointerdown",
        event => {

          event.stopPropagation();


          activateItem(
            note,
            noteData
          );

        }
      );


      /* AUTO-SAVE TEXT */

      let saveTimer;


      textarea.addEventListener(
        "input",
        () => {

          noteData.text =
            textarea.value;


          showSaving();


          clearTimeout(
            saveTimer
          );


          saveTimer =
            setTimeout(
              async () => {

                await saveItemData(
                  noteData
                );


                showSaved();

              },
              350
            );

        }
      );


      /* DRAG USING TOP GRIP */

      grip.addEventListener(
        "pointerdown",
        event => {

          event.stopPropagation();

          event.preventDefault();


          activateItem(
            note,
            noteData
          );


          startDragging(
            event,
            note,
            noteData,
            grip
          );

        }
      );


      /* RESIZE */

      resizeHandle.addEventListener(
        "pointerdown",
        event => {

          event.stopPropagation();

          event.preventDefault();


          activateItem(
            note,
            noteData
          );


          startResizing(
            event,
            note,
            noteData,
            resizeHandle,
            110,
            300
          );

        }
      );


      /* ROTATE LEFT */

      rotateLeft.addEventListener(
        "click",
        async event => {

          event.stopPropagation();


          noteData.rotation =
            (noteData.rotation || 0)
            - 3;


          note.style.transform =
            `rotate(${noteData.rotation}deg)`;


          showSaving();


          await saveItemData(
            noteData
          );


          showSaved();

        }
      );


      /* ROTATE RIGHT */

      rotateRight.addEventListener(
        "click",
        async event => {

          event.stopPropagation();


          noteData.rotation =
            (noteData.rotation || 0)
            + 3;


          note.style.transform =
            `rotate(${noteData.rotation}deg)`;


          showSaving();


          await saveItemData(
            noteData
          );


          showSaved();

        }
      );


      /* DELETE */

      deleteButton.addEventListener(
        "click",
        async event => {

          event.stopPropagation();


          note.remove();


          if (
            activeItem === note
          ) {

            activeItem = null;

          }


          await deleteItemData(
            noteData.id
          );


          updateEmptyState();

          showSaved();

        }
      );

    }


    /* ---------------------------------
       SHARED DRAG
    --------------------------------- */

    function startDragging(
      event,
      element,
      itemData,
      captureElement
    ) {

      const startX =
        event.clientX;


      const startY =
        event.clientY;


      const startLeft =
        parseFloat(
          element.style.left
        ) || 0;


      const startTop =
        parseFloat(
          element.style.top
        ) || 0;


      captureElement.setPointerCapture(
        event.pointerId
      );


      const move =
        moveEvent => {

          const dx =
            moveEvent.clientX
            - startX;


          const dy =
            moveEvent.clientY
            - startY;


          let nextX =
            startLeft
            + dx;


          let nextY =
            startTop
            + dy;


          nextX =
            Math.max(
              -element.offsetWidth
              * 0.4,

              Math.min(
                board.clientWidth
                - element.offsetWidth
                * 0.6,

                nextX
              )
            );


          nextY =
            Math.max(
              -element.offsetHeight
              * 0.3,

              Math.min(
                board.clientHeight
                - element.offsetHeight
                * 0.5,

                nextY
              )
            );


          element.style.left =
            `${nextX}px`;


          element.style.top =
            `${nextY}px`;


          itemData.x =
            nextX;


          itemData.y =
            nextY;

        };


      const up =
        async () => {

          captureElement
            .removeEventListener(
              "pointermove",
              move
            );


          captureElement
            .removeEventListener(
              "pointerup",
              up
            );


          captureElement
            .removeEventListener(
              "pointercancel",
              up
            );


          showSaving();


          await saveItemData(
            itemData
          );


          showSaved();

        };


      captureElement.addEventListener(
        "pointermove",
        move
      );


      captureElement.addEventListener(
        "pointerup",
        up
      );


      captureElement.addEventListener(
        "pointercancel",
        up
      );

    }


    /* ---------------------------------
       SHARED RESIZE
    --------------------------------- */

    function startResizing(
      event,
      element,
      itemData,
      handle,
      minimum,
      maximum
    ) {

      const startX =
        event.clientX;


      const startWidth =
        element.offsetWidth;


      handle.setPointerCapture(
        event.pointerId
      );


      const move =
        moveEvent => {

          const difference =
            moveEvent.clientX
            - startX;


          const width =
            Math.max(
              minimum,

              Math.min(
                maximum,
                startWidth
                + difference
              )
            );


          element.style.width =
            `${width}px`;


          itemData.width =
            width;

        };


      const up =
        async () => {

          handle.removeEventListener(
            "pointermove",
            move
          );


          handle.removeEventListener(
            "pointerup",
            up
          );


          handle.removeEventListener(
            "pointercancel",
            up
          );


          showSaving();


          await saveItemData(
            itemData
          );


          showSaved();

        };


      handle.addEventListener(
        "pointermove",
        move
      );


      handle.addEventListener(
        "pointerup",
        up
      );


      handle.addEventListener(
        "pointercancel",
        up
      );

    }


    /* ---------------------------------
       CLEAR BOARD
    --------------------------------- */

    clearBoardButton.addEventListener(
      "click",
      async () => {

        const items =
          board.querySelectorAll(
            ".board-item"
          );


        if (
          !items.length
        ) {

          return;

        }


        const confirmed =
          confirm(
            "Clear every image and note from this pinboard?"
          );


        if (
          !confirmed
        ) {

          return;

        }


        showSaving();


        await clearItemData();


        items.forEach(
          item => item.remove()
        );


        activeItem = null;


        updateEmptyState();

        showSaved();

      }
    );


    /* ---------------------------------
       LOAD SAVED BOARD
    --------------------------------- */

    async function start() {

      try {

        await openDatabase();


        const items =
          await getAllItems();


        items
          .sort(
            (a, b) =>
              (a.z || 0)
              - (b.z || 0)
          )
          .forEach(
            itemData => {

              if (
                itemData.type ===
                "note"
              ) {

                createNoteElement(
                  itemData
                );

              } else {

                createPhotoElement(
                  itemData
                );

              }

            }
          );


        updateEmptyState();


      } catch (error) {

        console.error(
          "Pinboard error:",
          error
        );


        savedStatus.textContent =
          "Storage unavailable";

      }

    }


    start();

  </script>
