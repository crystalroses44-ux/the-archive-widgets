<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Word Garden</title>

  <style>

    /* ---------------------------------
       BASE
    --------------------------------- */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: transparent;
    }

    body {
      padding: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      color: #51483D;
    }


    /* ---------------------------------
       MAIN WIDGET
    --------------------------------- */

    .widget {
      width: 100%;

      aspect-ratio: 1 / 1.88;

      min-height: 430px;

      display: flex;
      flex-direction: column;

      background: #FFFDF8;

      border: 1px solid #B68B45;

      outline: 1px solid #DED5BD;
      outline-offset: -5px;

      padding: 18px 14px 14px;

      overflow: hidden;
    }


    /* ---------------------------------
       HEADER
    --------------------------------- */

    .header {
      text-align: center;
      margin-bottom: 15px;
      flex-shrink: 0;
    }

    .star {
      color: #B68B45;
      font-size: 9px;
      margin-bottom: 5px;
    }

    .header h1 {
      margin: 0;

      font-size: 15px;
      font-weight: normal;

      letter-spacing: 0.14em;

      text-transform: uppercase;

      color: #51483D;
    }


    /* ---------------------------------
       MODE BUTTONS
    --------------------------------- */

    .mode-tabs {
      display: flex;

      justify-content: center;

      gap: 7px;

      margin-bottom: 14px;

      flex-shrink: 0;
    }

    .mode-button {
      border: 1px solid #D5CAB0;

      background: #FBF8EF;

      padding: 5px 9px;

      font-family: inherit;

      font-size: 9.5px;

      color: #70433F;

      cursor: pointer;

      transition:
        background 150ms ease,
        border-color 150ms ease;
    }

    .mode-button.active {
      background: #F2EEDC;
      border-color: #B68B45;
    }

    .mode-button:hover {
      background: #F7F3E8;
    }


    /* ---------------------------------
       CONTENT AREA
    --------------------------------- */

    #content {
      flex: 1;

      min-height: 0;

      display: flex;

      flex-direction: column;
    }


    /* ---------------------------------
       WORD CARD
    --------------------------------- */

    .word-card {
      flex: 1;

      min-height: 0;

      border: 1px solid #D8CFB7;

      background: #FAF8F1;

      padding: 18px 13px 12px;

      text-align: center;

      display: flex;

      flex-direction: column;

      align-items: center;

      overflow: hidden;
    }

    .card-main {
      width: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      flex: 1;

      min-height: 0;
    }


    /* ---------------------------------
       LABEL
    --------------------------------- */

    .label {
      margin-bottom: 8px;

      font-size: 7.5px;

      letter-spacing: 0.12em;

      text-transform: uppercase;

      color: #829074;
    }


    /* ---------------------------------
       WORD
    --------------------------------- */

    .word {
      margin: 0;

      font-size: 25px;

      font-weight: normal;

      line-height: 1.1;

      color: #51483D;

      overflow-wrap: anywhere;
    }

    .part-of-speech {
      margin-top: 5px;

      font-size: 10px;

      font-style: italic;

      color: #829074;
    }


    /* ---------------------------------
       ORNAMENT
    --------------------------------- */

    .rule {
      display: flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      margin: 15px 0;
    }

    .rule span {
      width: 31px;

      height: 1px;

      background: #C8B788;
    }

    .rule b {
      color: #B68B45;

      font-size: 7px;

      font-weight: normal;
    }


    /* ---------------------------------
       PROMPT
    --------------------------------- */

    .prompt {
      font-size: 10.5px;

      line-height: 1.5;

      color: #6A6258;
    }


    /* ---------------------------------
       REVEAL BUTTON
    --------------------------------- */

    .button-row {
      display: flex;

      justify-content: center;

      margin-top: 13px;
    }

    .action-button {
      border: 1px solid #CDBE99;

      background: #FFFDF8;

      padding: 6px 11px;

      font-family: inherit;

      font-size: 9.5px;

      color: #70433F;

      cursor: pointer;

      transition: background 150ms ease;
    }

    .action-button:hover {
      background: #F7F3E8;
    }


    /* ---------------------------------
       DEFINITION
    --------------------------------- */

    .definition-box {
      display: none;

      width: 100%;

      max-height: 122px;

      overflow-y: auto;

      margin-top: 12px;

      padding: 10px 11px;

      background: #F7F3E8;

      border: 1px solid #DDD2B8;

      text-align: left;

      font-size: 10px;

      line-height: 1.45;

      color: #51483D;

      flex-shrink: 0;

      scrollbar-width: thin;
      scrollbar-color: #C8B788 transparent;
    }

    .definition-box.visible {
      display: block;
    }

    .definition-box strong {
      display: block;

      margin-bottom: 6px;

      font-size: 7.5px;

      letter-spacing: 0.1em;

      text-transform: uppercase;

      color: #829074;
    }

    .definition-box::-webkit-scrollbar {
      width: 5px;
    }

    .definition-box::-webkit-scrollbar-track {
      background: transparent;
    }

    .definition-box::-webkit-scrollbar-thumb {
      background: #C8B788;
      border-radius: 8px;
    }


    /* ---------------------------------
       FLASHCARD NAVIGATION
    --------------------------------- */

    .flashcard-nav {
      width: 100%;

      display: none;

      align-items: center;

      justify-content: space-between;

      gap: 7px;

      margin-top: 10px;

      flex-shrink: 0;
    }

    .flashcard-nav.visible {
      display: flex;
    }

    .nav-button {
      border: 1px solid #D5CAB0;

      background: #FFFDF8;

      padding: 5px 7px;

      font-family: inherit;

      font-size: 8.5px;

      color: #70433F;

      cursor: pointer;

      white-space: nowrap;

      transition: background 150ms ease;
    }

    .nav-button:hover {
      background: #F7F3E8;
    }

    .card-count {
      flex: 1;

      text-align: center;

      font-size: 7.5px;

      letter-spacing: 0.08em;

      color: #829074;
    }


    /* ---------------------------------
       FOOTER
    --------------------------------- */

    .footer-link-wrap {
      display: flex;

      justify-content: flex-end;

      align-items: center;

      min-height: 35px;

      padding-top: 8px;

      padding-right: 2px;

      flex-shrink: 0;
    }

    .use-link {
      color: #70433F;

      font-size: 9.5px;

      font-style: italic;

      text-decoration: none;
    }

    .use-link:hover {
      text-decoration: underline;
    }


    /* ---------------------------------
       LOADING / ERROR
    --------------------------------- */

    .loading,
    .error {
      flex: 1;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 30px 12px;

      text-align: center;

      font-size: 10.5px;

      font-style: italic;

      color: #829074;
    }


    /* ---------------------------------
       SMALL WIDTHS
    --------------------------------- */

    @media (max-width: 320px) {

      .widget {
        min-height: 410px;

        padding:
          16px 11px
          12px;
      }

      .header {
        margin-bottom: 12px;
      }

      .header h1 {
        font-size: 14px;
      }

      .mode-tabs {
        margin-bottom: 12px;
      }

      .mode-button {
        padding: 5px 7px;
        font-size: 9px;
      }

      .word-card {
        padding: 15px 10px 10px;
      }

      .word {
        font-size: 23px;
      }

      .rule {
        margin: 12px 0;
      }

      .definition-box {
        max-height: 110px;
      }

      .nav-button {
        padding: 5px 6px;
        font-size: 8px;
      }

    }

  </style>

</head>


<body>

  <section class="widget">

    <!-- HEADER -->

    <header class="header">

      <div class="star">
        ✦
      </div>

      <h1>
        Word Garden
      </h1>

    </header>


    <!-- MODES -->

    <div class="mode-tabs">

      <button
        class="mode-button active"
        id="dailyModeButton"
        type="button"
      >
        Word of the Day
      </button>

      <button
        class="mode-button"
        id="flashcardModeButton"
        type="button"
      >
        Flashcards
      </button>

    </div>


    <!-- CONTENT -->

    <div id="content">

      <div class="loading">
        Gathering words from the garden...
      </div>

    </div>

  </section>


  <script>

    const feedUrl =
      "https://archive-word-garden.crystalroses44.workers.dev/?widget=dashboard";


    const fullWidgetUrl =
      "https://crystalroses44-ux.github.io/the-archive-widgets/word-garden/";


    let words = [];

    let currentWord = null;

    let currentMode = "daily";

    let flashcardDeck = [];

    let flashcardIndex = 0;


    const todayKey =
      new Date()
        .toISOString()
        .slice(0, 10);


    /* ---------------------------------
       LOAD WORDS
    --------------------------------- */

    async function loadWords() {

      try {

        const response =
          await fetch(feedUrl);


        if (!response.ok) {

          throw new Error(
            `Worker returned ${response.status}`
          );

        }


        const data =
          await response.json();


        words =
          Array.isArray(data.words)
            ? data.words
            : [];


        if (!words.length) {

          showError(
            "No completed Word Garden entries are available yet."
          );

          return;

        }


        createFlashcardDeck();

        showDailyWord();


      } catch (error) {

        console.error(error);

        showError(
          "Unable to load the Word Garden right now."
        );

      }

    }


    /* ---------------------------------
       DAILY WORD
    --------------------------------- */

    function hashString(text) {

      let hash = 0;


      for (
        let i = 0;
        i < text.length;
        i++
      ) {

        hash =
          (
            (hash << 5)
            - hash
          )
          + text.charCodeAt(i);


        hash |= 0;

      }


      return Math.abs(hash);

    }


    function getDailyWord() {

      const index =
        hashString(todayKey)
        % words.length;


      return words[index];

    }


    /* ---------------------------------
       FLASHCARD DECK
    --------------------------------- */

    function createFlashcardDeck() {

      flashcardDeck =
        [...words];


      for (
        let i =
          flashcardDeck.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random()
            * (i + 1)
          );


        [
          flashcardDeck[i],
          flashcardDeck[j]
        ] =
        [
          flashcardDeck[j],
          flashcardDeck[i]
        ];

      }


      flashcardIndex = 0;

    }


    function getCurrentFlashcard() {

      if (!flashcardDeck.length) {

        createFlashcardDeck();

      }


      return flashcardDeck[
        flashcardIndex
      ];

    }


    function nextFlashcard() {

      if (!flashcardDeck.length) {
        return;
      }


      flashcardIndex =
        (
          flashcardIndex + 1
        )
        % flashcardDeck.length;


      currentWord =
        getCurrentFlashcard();


      renderWord();

    }


    function previousFlashcard() {

      if (!flashcardDeck.length) {
        return;
      }


      flashcardIndex =
        (
          flashcardIndex
          - 1
          + flashcardDeck.length
        )
        % flashcardDeck.length;


      currentWord =
        getCurrentFlashcard();


      renderWord();

    }


    /* ---------------------------------
       MODES
    --------------------------------- */

    function showDailyWord() {

      currentMode = "daily";


      updateModeButtons();


      currentWord =
        getDailyWord();


      renderWord();

    }


    function showFlashcardWord() {

      currentMode = "flashcard";


      updateModeButtons();


      if (!flashcardDeck.length) {

        createFlashcardDeck();

      }


      currentWord =
        getCurrentFlashcard();


      renderWord();

    }


    function updateModeButtons() {

      document
        .getElementById(
          "dailyModeButton"
        )
        .classList
        .toggle(
          "active",
          currentMode === "daily"
        );


      document
        .getElementById(
          "flashcardModeButton"
        )
        .classList
        .toggle(
          "active",
          currentMode === "flashcard"
        );

    }


    /* ---------------------------------
       RENDER
    --------------------------------- */

    function renderWord() {

      const content =
        document.getElementById(
          "content"
        );


      const useUrl =
        `${fullWidgetUrl}?word=${encodeURIComponent(
          currentWord.word
        )}`;


      const flashcardNavigation =
        currentMode === "flashcard"
          ? `
            <div class="flashcard-nav visible">

              <button
                class="nav-button"
                id="previousCardButton"
                type="button"
              >
                ← Previous
              </button>

              <div class="card-count">
                ${flashcardIndex + 1}
                of
                ${flashcardDeck.length}
              </div>

              <button
                class="nav-button"
                id="nextCardButton"
                type="button"
              >
                Next →
              </button>

            </div>
          `
          : "";


      content.innerHTML = `

        <div class="word-card">

          <div class="card-main">

            <div class="label">

              ${
                currentMode === "daily"
                  ? "Today's Word"
                  : "Review Card"
              }

            </div>


            <h2 class="word">

              ${escapeHtml(
                currentWord.word
              )}

            </h2>


            <div class="part-of-speech">

              ${escapeHtml(
                currentWord.partOfSpeech
              )}

            </div>


            <div class="rule">

              <span></span>

              <b>✦</b>

              <span></span>

            </div>


            <div class="prompt">

              Do you remember what this word means?

            </div>


            <div class="button-row">

              <button
                class="action-button"
                id="revealButton"
                type="button"
              >
                Reveal Meaning
              </button>

            </div>


            <div
              class="definition-box"
              id="definitionBox"
            >

              <strong>
                Meaning
              </strong>

              ${
                formatText(
                  currentWord.definition
                )
              }

            </div>

          </div>


          ${flashcardNavigation}

        </div>


        <div class="footer-link-wrap">

          <a
            class="use-link"
            href="${useUrl}"
            target="_blank"
            rel="noopener noreferrer"
          >
            Use this word →
          </a>

        </div>

      `;


      document
        .getElementById(
          "revealButton"
        )
        .addEventListener(
          "click",
          toggleDefinition
        );


      if (
        currentMode === "flashcard"
      ) {

        document
          .getElementById(
            "previousCardButton"
          )
          .addEventListener(
            "click",
            previousFlashcard
          );


        document
          .getElementById(
            "nextCardButton"
          )
          .addEventListener(
            "click",
            nextFlashcard
          );

      }

    }


    /* ---------------------------------
       DEFINITION
    --------------------------------- */

    function toggleDefinition() {

      const box =
        document.getElementById(
          "definitionBox"
        );


      const button =
        document.getElementById(
          "revealButton"
        );


      const isVisible =
        box.classList.contains(
          "visible"
        );


      box.classList.toggle(
        "visible",
        !isVisible
      );


      button.textContent =
        isVisible
          ? "Reveal Meaning"
          : "Hide Meaning";

    }


    /* ---------------------------------
       HELPERS
    --------------------------------- */

    function formatText(text) {

      const cleanedText =
        text
          ? String(text).trim()
          : "No definition added yet.";


      return escapeHtml(
        cleanedText
      )
        .replace(
          /\n/g,
          "<br>"
        );

    }


    function escapeHtml(
      text = ""
    ) {

      return String(text)
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /* ---------------------------------
       ERROR
    --------------------------------- */

    function showError(message) {

      document
        .getElementById(
          "content"
        )
        .innerHTML = `

          <div class="error">

            ${escapeHtml(message)}

          </div>

        `;

    }


    /* ---------------------------------
       EVENTS
    --------------------------------- */

    document
      .getElementById(
        "dailyModeButton"
      )
      .addEventListener(
        "click",
        showDailyWord
      );


    document
      .getElementById(
        "flashcardModeButton"
      )
      .addEventListener(
        "click",
        showFlashcardWord
      );


    /* ---------------------------------
       START
    --------------------------------- */

    loadWords();

  </script>

</body>

</html>
